spring:
  application:
    name: coopvote-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coopvote}
    username: ${DB_USERNAME:coopvote}
    password: ${DB_PASSWORD:coopvote}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.felipericarte.coopvote: INFO

