spring:
  application:
    name: coopvote-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coopvote}
    username: ${DB_USERNAME:coopvote}
    password: ${DB_PASSWORD:coopvote}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

coopvote:
  auth:
    secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER:coopvote-api}
    audience: ${AUTH_JWT_AUDIENCE:coopvote-api}
    token-ttl: ${AUTH_TOKEN_TTL:30m}
    local-seed:
      enabled: ${AUTH_LOCAL_SEED:false}
  mobile:
    callback-base-url: ${CALLBACK_BASE_URL:http://localhost:8080}
  eligibility:
    enabled: ${ELIGIBILITY_ENABLED:true}
    base-url: ${ELIGIBILITY_BASE_URL:https://user-info.herokuapp.com}
    timeout: ${ELIGIBILITY_TIMEOUT:2s}

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.felipericarte.coopvote: INFO

# Sessão do associado: segredo obrigatório (sem padrão), ≥ 32 bytes; tokens HS256 com issuer/audience.
# coopvote.auth.local-seed.enabled=true cria associados sintéticos; só para a jornada local.
