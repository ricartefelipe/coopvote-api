# Banco: PostgreSQL real via Testcontainers (TestcontainersConfig); nada de H2.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

logging:
  structured:
    format:
      console:
  level:
    root: WARN

coopvote:
  auth:
    secret: coopvote-test-secret-with-at-least-32-bytes
    token-ttl: 30m
    local-seed:
      enabled: false
  mobile:
    callback-base-url: http://mobile.test:9090
  eligibility:
    enabled: false
