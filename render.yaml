services:
  - type: web
    name: coopvote-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    # Deploy só por decisão do proprietário: integrar em main não publica.
    autoDeployTrigger: off
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coopvote-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: coopvote-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: coopvote-db
          property: password
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"

databases:
  - name: coopvote-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: coopvote
    user: coopvote
    ipAllowList: []
