services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-coopvote}
      POSTGRES_USER: ${DB_USERNAME:-coopvote}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coopvote}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-coopvote}
      DB_USERNAME: ${DB_USERNAME:-coopvote}
      DB_PASSWORD: ${DB_PASSWORD:-coopvote}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-http://localhost:8080}
      # Valor local de desenvolvimento; ambientes compartilhados definem um segredo próprio.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-coopvote-local-development-secret-with-32-bytes}
      AUTH_LOCAL_SEED: ${AUTH_LOCAL_SEED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

volumes:
  postgres_data:

